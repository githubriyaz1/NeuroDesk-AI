version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: neurodesk-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: neurodesk
      POSTGRES_PASSWORD: neurodesk_secret_password
      POSTGRES_DB: neurodesk_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neurodesk -d neurodesk_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: neurodesk-backend
    restart: unless-stopped
    environment:
      ENVIRONMENT: production
      PROJECT_NAME: "NeuroDesk AI"
      VERSION: "1.0.0"
      API_V1_STR: "/api/v1"
      SECRET_KEY: "super_secret_jwt_key_neurodesk_2026_enterprise_prod"
      DATABASE_URL: "postgresql+asyncpg://neurodesk:neurodesk_secret_password@postgres:5432/neurodesk_db"
      STORAGE_LOCAL_ROOT: "storage/uploads"
      STORAGE_TEMP_DIR: "storage/temp"
      DEFAULT_STORAGE_PROVIDER: "local"
      MAX_UPLOAD_SIZE_BYTES: 104857600
      LOG_LEVEL: "INFO"
    ports:
      - "8000:8000"
    volumes:
      - dams_uploads:/app/storage/uploads
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: neurodesk-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  dams_uploads:
